{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 2rem; text-align: center;">Login to SmartUPI</h2>

        {% if error %}
        <div style="color: var(--error); margin-bottom: 1.5rem; text-align: center;">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" name="mobile" required placeholder="9876543210">
            </div>

            <div class="input-group">
                <label>UPI App Lock PIN</label>
                <input type="password" name="pin" maxlength="6" required placeholder="••••••" autocomplete="new-password">
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">
                Enter Dashboard
            </button>
            <div style="text-align: right; margin-top: 0.8rem;">
                <a href="{{ url_for('forgot_password') }}" style="color: var(--primary); font-size: 0.85rem; text-decoration: none; font-weight: 500;">Forgot Password?</a>
            </div>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            New to SmartUPI? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Sign
                Up</a>
        </p>
    </div>
</div>
{% endblock %}
