{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2 style="margin-bottom: 2rem; font-size: 2rem; text-align: center;">Join SmartUPI</h2>

        <form id="register-form">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="full_name" required pattern="[A-Za-z\s]+" title="Please enter only letters and spaces" placeholder="John Doe">
            </div>

            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobile" required placeholder="+91 9876543210">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com" autocomplete="off">
            </div>

            <div class="input-group">
                <label>Bank Card (Last 4 Digits)</label>
                <input type="text" id="card_last4" maxlength="4" required placeholder="1234">
            </div>

            <div class="input-group">
                <label>App Lock PIN (6 Digits)</label>
                <input type="password" id="pin" maxlength="6" required placeholder="••••••" autocomplete="new-password">
            </div>

            <div style="text-align: center; margin-top: 2rem;">
                <p style="color: var(--text-muted); margin-bottom: 1rem;">Prepare for Identity Verification (Facial
                    Scan)</p>
                <div id="camera-container">
                    <video id="video" autoplay muted></video>
                </div>
                <button type="button" class="btn" id="capture-btn" style="background: var(--accent);">
                    Capture & Verify
                </button>
            </div>

            <canvas id="canvas" style="display:none;"></canvas>
            <input type="hidden" id="face_image">

            <button type="submit" class="btn" id="submit-btn" style="width: 100%; margin-top: 2rem; display: none;">
                Create Account
            </button>
        </form>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const faceInput = document.getElementById('face_image');
    const submitBtn = document.getElementById('submit-btn');

    // Access Camera
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            showToast("Camera access denied!", "error");
        });

    captureBtn.onclick = () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL('image/jpeg');
        faceInput.value = imageData;

        captureBtn.innerHTML = "Photo Captured ✓";
        captureBtn.style.background = "#059669";
        submitBtn.style.display = "block";
        showToast("Identity photo captured!");
    };

    document.getElementById('register-form').onsubmit = async (e) => {
        e.preventDefault();

        const formData = new FormData();
        formData.append('full_name', document.getElementById('full_name').value);
        formData.append('mobile', document.getElementById('mobile').value);
        formData.append('email', document.getElementById('email').value);
        formData.append('card_last4', document.getElementById('card_last4').value);
        formData.append('pin', document.getElementById('pin').value);
        formData.append('face_image', faceInput.value);

        submitBtn.innerHTML = '<span class="spinner"></span> Creating...';
        submitBtn.disabled = true;

        try {
            const resp = await fetch('/register', {
                method: 'POST',
                body: formData
            });
            const result = await resp.json();

            if (result.status === 'success') {
                showToast(result.message);
                setTimeout(() => window.location.href = '/dashboard', 2000);
            } else {
                showToast(result.message, "error");
                submitBtn.innerHTML = "Create Account";
                submitBtn.disabled = false;
            }
        } catch (err) {
            showToast("Server error during registration", "error");
            submitBtn.disabled = false;
        }
    };
</script>
{% endblock %}
