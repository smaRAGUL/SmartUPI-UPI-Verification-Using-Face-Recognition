{% extends 'base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto;">
    <div class="card" id="form-container">
        <!-- Step 1: Email Form -->
        <div id="step-email">
            <h2 style="margin-bottom: 2rem; text-align: center;">Reset PIN</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem;">Enter your registered email address to receive an OTP.</p>
            
            <form id="email-form">
                <div class="input-group">
                    <label>Registered Email</label>
                    <input type="email" id="reset_email" required placeholder="john@example.com" autocomplete="off">
                </div>
                <button type="submit" class="btn" id="email-btn" style="width: 100%; margin-top: 1rem;">
                    Continue
                </button>
            </form>
        </div>

        <!-- Step 2: OTP Form -->
        <div id="step-otp" style="display: none;">
            <h2 style="margin-bottom: 2rem; text-align: center;">Verify OTP</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem;">We've sent a 6-digit code to <span id="display-email" style="color: white; font-weight: bold;"></span>.</p>
            
            <form id="otp-form">
                <div class="input-group">
                    <label>Enter OTP</label>
                    <input type="text" id="reset_otp" maxlength="6" required placeholder="000000" autocomplete="off" style="text-align: center; letter-spacing: 0.5rem; font-size: 1.5rem;">
                </div>
                <button type="submit" class="btn" id="otp-btn" style="width: 100%; margin-top: 1rem;">
                    Verify OTP
                </button>
                <div style="text-align: center; margin-top: 1rem;">
                    <a href="javascript:void(0)" onclick="resendOTP()" style="color: var(--primary); font-size: 0.9rem;">Resend OTP</a>
                </div>
            </form>
        </div>

        <!-- Step 3: New PIN Form -->
        <div id="step-pin" style="display: none;">
            <h2 style="margin-bottom: 2rem; text-align: center;">Set New PIN</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem;">Create a strong 6-digit PIN for your account.</p>
            
            <form id="pin-form">
                <div class="input-group">
                    <label>Enter New PIN</label>
                    <input type="password" id="new_pin" maxlength="6" required placeholder="••••••" autocomplete="new-password">
                </div>
                <div class="input-group">
                    <label>Confirm New PIN</label>
                    <input type="password" id="confirm_pin" maxlength="6" required placeholder="••••••" autocomplete="new-password">
                </div>
                <button type="submit" class="btn" id="pin-btn" style="width: 100%; margin-top: 1rem;">
                    Update PIN
                </button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Remembered your PIN? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Login</a>
        </p>
    </div>
</div>

<script>
    let currentEmail = "";

    document.getElementById('email-form').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('reset_email').value;
        const btn = document.getElementById('email-btn');
        
        btn.innerHTML = '<span class="spinner"></span> Sending...';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('email', email);

        try {
            const res = await fetch('/api/send_otp', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.status === 'success') {
                currentEmail = email;
                document.getElementById('display-email').innerText = email;
                document.getElementById('step-email').style.display = 'none';
                document.getElementById('step-otp').style.display = 'block';
                showToast(data.message);
            } else {
                showToast(data.message, 'error');
            }
        } catch (err) {
            showToast("Failed to send OTP", "error");
        } finally {
            btn.innerHTML = 'Continue';
            btn.disabled = false;
        }
    };

    window.resendOTP = async () => {
        if (!currentEmail) return;
        const formData = new FormData();
        formData.append('email', currentEmail);
        try {
            const res = await fetch('/api/send_otp', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.status === 'success') {
                showToast("New OTP sent to email!");
            } else {
                showToast(data.message, 'error');
            }
        } catch(e) {
            showToast("Failed to resend OTP", "error");
        }
    };

    document.getElementById('otp-form').onsubmit = async (e) => {
        e.preventDefault();
        const otp = document.getElementById('reset_otp').value;
        const btn = document.getElementById('otp-btn');
        
        btn.innerHTML = '<span class="spinner"></span> Verifying...';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('email', currentEmail);
        formData.append('otp', otp);

        try {
            const res = await fetch('/api/verify_otp', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.status === 'success') {
                document.getElementById('step-otp').style.display = 'none';
                document.getElementById('step-pin').style.display = 'block';
                showToast(data.message);
            } else {
                showToast(data.message, 'error');
            }
        } catch (err) {
            showToast("Verification failed", "error");
        } finally {
            btn.innerHTML = 'Verify OTP';
            btn.disabled = false;
        }
    };

    document.getElementById('pin-form').onsubmit = async (e) => {
        e.preventDefault();
        const pin = document.getElementById('new_pin').value;
        const confirm_pin = document.getElementById('confirm_pin').value;
        const btn = document.getElementById('pin-btn');
        
        if (pin !== confirm_pin) {
            showToast("PINs do not match", "error");
            return;
        }
        if (pin.length !== 6 || isNaN(pin)) {
            showToast("PIN must be exactly 6 numeric digits", "error");
            return;
        }

        btn.innerHTML = '<span class="spinner"></span> Updating...';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('email', currentEmail);
        formData.append('otp', document.getElementById('reset_otp').value);
        formData.append('pin', pin);

        try {
            const res = await fetch('/api/reset_pin', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.status === 'success') {
                showToast("PIN reset successful! Redirecting...");
                setTimeout(() => window.location.href = '/login', 2000);
            } else {
                showToast(data.message, 'error');
                btn.innerHTML = 'Update PIN';
                btn.disabled = false;
            }
        } catch (err) {
            showToast("Update failed", "error");
            btn.innerHTML = 'Update PIN';
            btn.disabled = false;
        }
    };
</script>
{% endblock %}
